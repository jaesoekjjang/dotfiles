[mgr]
prepend_keymap = [
  # yazi 내부 yank
  { on = [
    "y",
    "y",
  ], run = "yank", desc = "Yank" },

  # 이미지 클립보드 복사 (사용자 스크립트)
  { on = [
    "y",
    "i",
  ], run = "shell -- ~/.config/yazi/scripts/copy-image.sh %h", desc = "Copy image to clipboard" },

  # 파일 이름 복사
  { on = [
    "y",
    "n",
  ], run = "shell -- sh -c 'basename \"%h\" | pbcopy'", desc = "Copy filename" },

  # 절대 경로 복사
  { on = [
    "y",
    "a",
  ], run = "shell -- sh -c 'printf \"%s\" \"%h\" | pbcopy'", desc = "Copy absolute path" },

  # 상대 경로 복사 (현재 디렉터리 기준)
  { on = [
    "y",
    "r",
  ], run = "shell -- sh -c 'realpath --relative-to=\"$(pwd)\" \"%h\" | pbcopy'", desc = "Copy relative path" },

  { on = [
    "g",
    "r",
  ], run = "shell 'ya emit cd \"$(git rev-parse --show-toplevel 2>/dev/null)\"'", desc = "Go to git root" },


  # Open
  { on = [
    "o",
    "v",
  ], run = 'shell "$EDITOR \"$@\"" --confirm', desc = "Open with Vim" },

  { on = [
    "o",
    "c",
  ], run = 'shell "code \"$@\"" --confirm', desc = "Open with VSCode" },

  { on = [
    "o",
    "f",
  ], run = 'shell "open -R \"$@\"" --confirm', desc = "Open in Finder" },

  { on = [
    "o",
    "t",
  ], run = 'shell "tmux new-window -c \"$(dirname \"$@\")\"" --confirm', desc = "Open tmux window" },


  # 압축 - zip
  { on = [
    "z",
    "z",
  ], run = 'shell "7z a \"${@##*/}.zip\" \"$@\"" --confirm', desc = "Compress to zip" },

  # 압축 - gz (단일 파일)
  { on = [
    "z",
    "g",
  ], run = 'shell "gzip -k \"$@\"" --confirm', desc = "Compress to gz" },

  # 묶기 - tar
  { on = [
    "z",
    "t",
  ], run = 'shell "tar cf \"${@##*/}.tar\" \"$@\"" --confirm', desc = "Compress to tar" },


  # 묶고,압축 - tar.gz
  { on = [
    "z",
    "a",
  ], run = 'shell "tar czf \"${@##*/}.tar.gz\" \"$@\"" --confirm', desc = "Compress to tar.gz" },

  # 해제 - 현재 위치에
  { on = [
    "z",
    "x",
  ], run = 'shell "7z x \"$@\" -o." --confirm', desc = "Extract here" },

  # 해제 - 새 폴더에 (파일명 기반)
  { on = [
    "z",
    "X",
  ], run = 'shell "7z x \"$@\" -o\"${@%.*}\"" --confirm', desc = "Extract to folder" },
]
