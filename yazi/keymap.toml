[mgr]
prepend_keymap = [

  # ##################
  #       Yank
  # ##################

  { on = ["y", "y"], run = "yank", desc = "Yank" },
  { on = ["y", "i"], run = "shell -- ~/.config/yazi/scripts/copy-image.sh %h", desc = "Copy image to clipboard" },
  { on = ["y", "n"], run = "shell -- sh -c 'basename \"%h\" | pbcopy'", desc = "Copy filename" },
  { on = ["y", "a"], run = "shell -- sh -c 'printf \"%s\" \"%h\" | pbcopy'", desc = "Copy absolute path" },
  { on = ["y", "r"], run = "shell -- sh -c 'realpath --relative-to=\"$(pwd)\" \"%h\" | pbcopy'", desc = "Copy relative path" },

  # ##################
  #       Go to
  # ##################

  { on = ["g", "r"], run = "shell 'ya emit cd \"$(git rev-parse --show-toplevel 2>/dev/null)\"'", desc = "Go to git root" },
  { on = ["g", "d"], run = "cd ~/Downloads", desc = "Go to Downloads" },
  { on = ["g", "."], run = "cd $DOTFILES", desc = "Go to dotfiles repo" },
  { on = ["g", ","], run = "cd ~/.config/yazi", desc = "Go to yazi config" },
  { on = ["g", "p"], run = "shell 'ya emit cd \"$(fd -H -t d .git ~ --max-depth 4 -E Library -E .cache -E node_modules | sed \"s|/.git||\" | fzf)\"' --block", desc = "Go to git project" },

  # ##################
  #       Open
  # ##################

  { on = ["o", "v"], run = 'shell "$EDITOR \"$@\"" --confirm', desc = "Open with Vim" },
  { on = ["o", "c"], run = 'shell "code \"$@\"" --confirm', desc = "Open with VSCode" },
  { on = ["o", "f"], run = 'shell "open -R \"$@\"" --confirm', desc = "Open in Finder" },
  { on = ["o", "k"], run = 'shell "open -na Ghostty --args --working-directory=\"$@\""', desc = "Open in Ghostty" },
  { on = ["o", "t", "t"], run = 'shell "tmux new-window -c \"$(dirname \"$@\")\"" --confirm', desc = "Open tmux window in current session" },
  { on = ["o", "t", "c"], run = 'shell "tmux list-sessions -F \"#{session_name}\" | fzf | xargs -I{} tmux new-window -t {} -c \"$@\"" --block --confirm', desc = "Open tmux window in selected session" },
  { on = ["o", "t", "s"], run = 'shell "tmux list-sessions -F \"#{session_name}\" | fzf | xargs -I{} tmux switch-client -t {}" --block --confirm', desc = "Switch to selected tmux session" },
  { on = ["o", "t", "n"], run = 'shell "tmux new-session -c \"$@\"" --confirm', desc = "Open new tmux session" },

  # ##################
  #     Archive
  # ##################

  { on = ["z", "z"], run = 'shell "7z a \"${@##*/}.zip\" \"$@\"" --confirm', desc = "Compress to zip" },
  { on = ["z", "g"], run = 'shell "gzip -k \"$@\"" --confirm', desc = "Compress to gz" },
  { on = ["z", "t"], run = 'shell "tar cf \"${@##*/}.tar\" \"$@\"" --confirm', desc = "Compress to tar" },
  { on = ["z", "a"], run = 'shell "tar czf \"${@##*/}.tar.gz\" \"$@\"" --confirm', desc = "Compress to tar.gz" },
  { on = ["z", "x"], run = 'shell "7z x \"$@\" -o." --confirm', desc = "Extract here" },
  { on = ["z", "X"], run = 'shell "7z x \"$@\" -o\"${@%.*}\"" --confirm', desc = "Extract to folder" },
]
