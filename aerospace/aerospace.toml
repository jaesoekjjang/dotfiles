  run = "move-node-to-workspace M"

[[on-window-detected]]
  if.app-id = 'com.kakao.KakaoTalkMac'
  run = "move-node-to-workspace M"

[[on-window-detected]]
  if.app-id = 'Mattermost.Desktop'
  run = "move-node-to-workspace M"

[[on-window-detected]]
  if.app-id = 'com.hnc.Discord'
  run = "move-node-to-workspace M"
# messenger end

# file explorer start
[[on-window-detected]]
