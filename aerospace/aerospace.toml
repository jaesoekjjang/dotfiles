    # join
    cmd-shift-h = ['join-with left', 'mode main']
    cmd-shift-j = ['join-with down', 'mode main']
    cmd-shift-k = ['join-with up', 'mode main']
    cmd-shift-l = ['join-with right', 'mode main']

    # move to monitor
    tab = 'workspace-back-and-forth'
    shift-tab = 'move-workspace-to-monitor --wrap-around next'

# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
    comma = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # reset layout
    f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
    backspace = ['close-all-windows-but-current', 'mode main']

    # sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
    #s = ['layout sticky tiling', 'mode main']

    down = 'volume down'
    up = 'volume up'
    shift-down = ['volume set 0', 'mode main']

# Application을Workspace에 자동 할당
# terminal start
[[on-window-detected]]
  if.app-id = 'com.mitchellh.ghostty'
  run = "move-node-to-workspace T"

[[on-window-detected]]
  if.app-id = 'net.kovidgoyal.kitty'
  run = "move-node-to-workspace T"
# terminal end

# browser start
[[on-window-detected]]
  if.app-id = 'com.google.Chrome'
  run = "move-node-to-workspace B"

[[on-window-detected]]
  if.app-id = 'com.apple.Safari'
  run = "move-node-to-workspace B"
# browser end

[[on-window-detected]]
  if.app-id = 'com.figma.Desktop'
  run = "move-node-to-workspace D"


# notes start
[[on-window-detected]]
