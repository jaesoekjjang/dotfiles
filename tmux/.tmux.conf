# Options
set -g default-terminal "ghostty"
set -s extended-keys on # enable extended keys
set -as terminal-features "xterm*:extkeys"  # enable xterm keys
set -sg terminal-overrides ",*:RGB"  # true color support
set -g escape-time 10 # disable delays on escape sequences
set -g mouse on
set -g renumber-windows on  # keep numbering sequential
set -g repeat-time 350 
set -g base-index 1
set -g pane-base-index 1
set -g detach-on-destroy off
set -g main-pane-width  75%
set -g main-pane-height 75%
# Theme: borders
set -g pane-border-style fg=black,bright
set -g pane-active-border-style fg=#ff6b9d
# Theme: status
set -g status-style bg=default,fg=white,bright
set -g status-left "#[fg=cyan,bright]#(cd #{pane_current_path} && git branch --show-current 2>/dev/null | awk '{b=substr($0,1,14); if(b) print \"\uf418 \" b}')  "
set -g status-left-length 50
set -g status-justify centre
set -g status-right "#[fg=white,bright]#{=14:window_name}  #[fg=yellow,bright]#{session_name}"
# Theme: status (windows)
set -g window-status-format "●"
set -g window-status-current-format "●"
set -g window-status-current-style "fg=#{?window_zoomed_flag,yellow,#ff6b9d}"
set -g window-status-bell-style "fg=red,nobold"
# shell
set -g default-shell /bin/zsh
set -g default-command /bin/zsh
set -g allow-passthrough on
set -g set-clipboard on

# prefix
set -g prefix C-b
set -g prefix2 C-k

# detach
bind-key C-d detach-client

# reload
bind-key r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded."

# split (with cwd preservation)
bind C-v split-window -h -c "#{pane_current_path}"
bind C-s split-window -v -c "#{pane_current_path}"

unbind -T root +
unbind -T root -
unbind -T root =
unbind -T root _
bind -r + resize-pane -U 5
bind -r _ resize-pane -D 5
bind -r - resize-pane -L 5
bind -r = resize-pane -R 5
#
# new window (with cwd preservation)
bind c new-window -c "#{pane_current_path}"
bind -r n next-window
bind -r v previous-window
bind -r p previous-window

bind -r C-o rotate-window

#ldefault split bindings with cwd preservation
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# panel
bind-key -r o select-pane -t :.+

# 숫자키 → pane 이동 (기본 window 이동 덮어쓰기)
bind 1 select-pane -t 1
bind 2 select-pane -t 2
bind 3 select-pane -t 3
bind 4 select-pane -t 4
bind 5 select-pane -t 5
bind 6 select-pane -t 6
bind 7 select-pane -t 7
bind 8 select-pane -t 8
bind 9 select-pane -t 9

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind m swap-pane -t 1 \; select-pane -t 1 \; select-layout main-vertical

# Custom layout: 20 | 60 | 20(top/bottom)
bind-key W \
  split-window -h -c "#{pane_current_path}" \; \
  split-window -h -c "#{pane_current_path}" \; \
  select-layout even-horizontal \; \
  resize-pane -t 1 -x "20%" \; \
  resize-pane -t 3 -x "20%" \; \
  select-pane -t 3 \; \
  split-window -v -c "#{pane_current_path}" \; \
  select-pane -t 2

bind-key C-l display-popup -h 40% -w 30% -E "~/.tmux/layout.sh"
bind M swap-pane -t 1 \; select-pane -t 1 \; select-layout main-horizontal

# bind m set -w @layout main-vertical  \; select-layout main-vertical
# bind M set -w @layout main-horizontal \; select-layout main-horizontal
#
# set-hook -g after-select-pane '\
#   if -F "#{==:#{@layout},main-vertical}" \
#     "swap-pane -t 1 ; select-layout main-vertical ; select-pane -t 1" ; \
#   if -F "#{==:#{@layout},main-horizontal}" \
#     "swap-pane -t 1 ; select-layout main-horizontal ; select-pane -t 1"'

# session
bind L switch-client -n
bind H switch-client -p
# vim mode selection
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"
bind -T copy-mode-vi WheelUpPane   send-keys -X -N 2 scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X -N 2 scroll-down

# TMUX_FZF
TMUX_FZF_LAUNCH_KEY="f"

# Plugins
set -g @plugin 'sainnhe/tmux-fzf'
# set -g @plugin 'christoomey/vim-tmux-navigator'
# set -g @vim_navigator_prefix_mapping_clear_screen ""
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-save 'P' # 사용하지 않는 키로 설정
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-boot 'on'
set -g @continuum-boot-options 'ghostty'
set -g @plugin 'wfxr/tmux-fzf-url'
run '~/.tmux/plugins/tpm/tpm'


# bind s display-popup -E -h 50% -w 60% \
#   "tmux list-sessions -F '#{session_name}' | fzf --reverse | xargs -r tmux switch-client -t"
# bind w display-popup -E -h 50% -w 60% \
#   "tmux list-windows -a -F '#{session_name}:#{window_index} #{window_name}' | fzf --reverse | awk '{print \$1}' | xargs -r tmux switch-client -t"

bind g display-popup -d "#{pane_current_path}" -h 90% -w 90% -E "lazygit"
bind d display-popup -h 40 -w 140 -E "workmux dashboard"
bind b run-shell "workmux sidebar"
